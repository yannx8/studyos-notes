name: release
# A tag equal to manifest.json's version (1.0.2, no "v"): rebuild from src/, check it matches main.js,
# attest where the files came from, then a GitHub release with main.js, manifest.json and styles.css.
on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches manifest.json
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"
      - name: Build matches main.js
        run: |
          npm ci
          npm run build
          git diff --exit-code main.js
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css
            manifest.json
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --title "$GITHUB_REF_NAME" --notes "StudyOS Notes $GITHUB_REF_NAME"
